[package]
name = "nova-native"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
description = "NOVA OS - portable Windows desktop with Unicode, UniKey and disposable Sandbox workflows"
license = "MIT"
authors = ["NOVA OS"]

[[bin]]
name = "NOVA"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "system_fonts"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sysinfo = "=0.40.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
