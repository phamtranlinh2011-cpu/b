name: Build NOVA Native for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build NOVA
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/NOVA-OS-Native-v0.3.1-USB"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Get-ChildItem "target/x86_64-pc-windows-msvc/release" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "NOVA EXE not found" }
          Copy-Item $exe.FullName "$out/NOVA.exe"
          Copy-Item "portable.flag" $out
          Copy-Item "README_PORTABLE.txt" $out
          New-Item -ItemType Directory -Force -Path "$out/Data/Users/Default" | Out-Null

      - name: Upload NOVA
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-OS-Native-v0.3.1-USB
          path: dist/NOVA-OS-Native-v0.3.1-USB/
